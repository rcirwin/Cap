name: cap

services:
  caddy:
    container_name: cap-caddy
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - cap-web
      - minio
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CAP_DOMAIN: ${CAP_DOMAIN:?set CAP_DOMAIN in .env}
      CAP_S3_DOMAIN: ${CAP_S3_DOMAIN:?set CAP_S3_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - cap-network

  cap-web:
    container_name: cap-web
    image: ghcr.io/${CAP_IMAGE_OWNER:-rcirwin}/cap-web:${CAP_IMAGE_TAG:-self-host}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      workflow-data-init:
        condition: service_completed_successfully
    env_file:
      - path: ./extra.env
        required: false
    environment:
      DATABASE_URL: mysql://cap:${MYSQL_PASSWORD:?}@mysql:3306/cap
      WEB_URL: https://${CAP_DOMAIN}
      NEXTAUTH_URL: https://${CAP_DOMAIN}
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:?}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET:?}
      CRON_SECRET: ${CRON_SECRET:?}
      CAP_AWS_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      CAP_AWS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      CAP_AWS_BUCKET: cap
      CAP_AWS_REGION: us-east-1
      S3_PUBLIC_ENDPOINT: https://${CAP_S3_DOMAIN}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_PATH_STYLE: "true"
      MEDIA_SERVER_URL: http://media-server:3456
      MEDIA_SERVER_WEBHOOK_URL: http://cap-web:3000
      CAP_CHROME_EXTENSION_ID: ${CAP_CHROME_EXTENSION_ID:?}
      CAP_ALLOWED_SIGNUP_DOMAINS: ${CAP_ALLOWED_SIGNUP_DOMAINS:?set your own email so nobody else can sign up}
      CAP_VIDEOS_DEFAULT_PUBLIC: ${CAP_VIDEOS_DEFAULT_PUBLIC:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      WORKFLOW_LOCAL_DATA_DIR: /var/lib/cap-workflow
    volumes:
      - cap-workflow-data:/var/lib/cap-workflow
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - cap-network

  workflow-data-init:
    container_name: cap-workflow-data-init
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 1001:1001 /var/lib/cap-workflow"]
    volumes:
      - cap-workflow-data:/var/lib/cap-workflow
    networks:
      - cap-network

  media-server:
    container_name: cap-media-server
    image: ghcr.io/${CAP_IMAGE_OWNER:-rcirwin}/cap-media-server:${CAP_IMAGE_TAG:-self-host}
    restart: unless-stopped
    environment:
      PORT: 3456
      MEDIA_SERVER_WEBHOOK_SECRET: ${MEDIA_SERVER_WEBHOOK_SECRET:?}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3456/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cap-network

  cron:
    container_name: cap-cron
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - cap-web
    environment:
      CRON_SECRET: ${CRON_SECRET:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 900
          for job in recover-failed-video-processing finalize-stale-desktop-segments; do
            curl -fsS -o /dev/null -H "Authorization: Bearer $$CRON_SECRET" "http://cap-web:3000/api/cron/$$job" || echo "cron $$job failed"
          done
        done
    networks:
      - cap-network

  mysql:
    container_name: cap-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cap
      MYSQL_USER: cap
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    command:
      - --max_connections=1000
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - cap-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cap", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cap-network

  minio:
    container_name: cap-minio
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - cap-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cap-network

  minio-setup:
    container_name: cap-minio-setup
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set capminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb capminio/cap --ignore-existing;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    networks:
      - cap-network

volumes:
  caddy-data:
  caddy-config:
  cap-mysql-data:
  cap-minio-data:
  cap-workflow-data:

networks:
  cap-network:
    driver: bridge
